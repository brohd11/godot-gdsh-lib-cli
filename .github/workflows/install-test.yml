# Installs a published release with this repo's install.sh / install.ps1 (what users fetch from main)
# on Windows, Linux and macOS, then runs gdsh in a scratch project. Runs after a tag's release
# workflow succeeds: a release created with the workflow token can't trigger `release: published`.
name: install-test
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to test; empty means the latest.
        type: string
        default: ""
      godot-version:
        description: A godotengine/godot-builds release name.
        type: string
        default: "4.7-stable"

jobs:
  install:
    # A manual release run builds without publishing, so only tag pushes have a release to test.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      GODOT_VERSION: ${{ inputs.godot-version || '4.7-stable' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release and Godot
        shell: bash
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$dl"
          # An empty tag downloads the latest release.
          gh release download ${TAG:+"$TAG"} -R "$GITHUB_REPOSITORY" -p gdsh-cli.zip -D "$dl"
          ver=${GODOT_VERSION%-*}
          case "$RUNNER_OS" in
            Windows) asset="Godot_v${GODOT_VERSION}_win64.exe.zip" ;;
            Linux) asset="Godot_v${GODOT_VERSION}_linux.x86_64.zip" ;;
            macOS) asset="Godot_v${GODOT_VERSION}_macos.universal.zip" ;;
          esac
          gh release download "$GODOT_VERSION" -R godotengine/godot-builds -p "$asset" -D "$dl"
          unzip -q "$dl/$asset" -d "$RUNNER_TEMP/godot"
          case "$RUNNER_OS" in
            Windows) bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_win64.exe" ;;
            Linux) bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"; chmod +x "$bin" ;;
            macOS) bin="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" ;;
          esac
          [ -f "$bin" ] || { echo "::error::no Godot binary at $bin"; ls -R "$RUNNER_TEMP/godot" | head -20; exit 1; }
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj"
          printf 'config_version=5\n\n[application]\n\nconfig/features=PackedStringArray("%s")\n' "$ver" > "$proj/project.godot"
          printf '#!gdsh\necho from file\n' > "$proj/t.gdsh"
          {
            echo "ZIP=$dl/gdsh-cli.zip"
            echo "GODOT_BIN=$bin"
            echo "PROJ=$proj"
            echo "BIN_DIR=$RUNNER_TEMP/bin"
            echo "GDSH_HOME=$RUNNER_TEMP/gdsh_home"
          } >> "$GITHUB_ENV"

      - name: Install and run (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          fail() { echo "::error::$*"; failed=1; }
          expect() { # name, expected stdout, expected exit, gdsh args...
            local name=$1 want=$2 code=$3; shift 3
            local out status
            out=$("$BIN_DIR/gdsh" "$@" 2>"$RUNNER_TEMP/err"); status=$?
            [ "$status" = "$code" ] || fail "$name: exit $status, expected $code; stderr: $(cat "$RUNNER_TEMP/err")"
            [ "$out" = "$want" ] || fail "$name: got [$out], expected [$want]"
          }

          sh install.sh --from "$ZIP" --dir "$BIN_DIR" || { echo "::error::install failed"; exit 1; }
          "$BIN_DIR/gdsh" --register "$GODOT_BIN" || fail "register failed"
          grep "^godot-" "$GDSH_HOME/executables" || fail "nothing registered"

          cd "$PROJ"
          expect "version" "gdsh-cli $(sed -n 's/^version="\(.*\)"/\1/p' "$GDSH_HOME/cli/package.cfg")" 0 --version
          "$BIN_DIR/gdsh" --help | grep -q "gdsh syntax" || fail "help lacks the syntax note"
          expect "echo" "hi" 0 'echo hi'
          expect "pipe" "hi" 0 'echo hi | grep h'
          expect "false" "" 1 'false'
          expect "block" "file: project.godot" 0 'for f in $(ls res://) { echo "file: $f" } | grep project'
          expect "script" "from file" 0 -f t.gdsh

          mkdir -p "$RUNNER_TEMP/foreign"
          echo foreign > "$RUNNER_TEMP/foreign/gdsh"
          sh "$GITHUB_WORKSPACE/install.sh" --from "$ZIP" --dir "$RUNNER_TEMP/foreign" && fail "installed over a foreign wrapper"
          sh "$GITHUB_WORKSPACE/install.sh" --uninstall --dir "$BIN_DIR" || fail "uninstall failed"
          [ ! -e "$BIN_DIR/gdsh" ] && [ ! -e "$GDSH_HOME/cli" ] || fail "uninstall left files"
          [ -f "$GDSH_HOME/executables" ] || fail "uninstall removed the registry"
          exit $failed

      - name: Install and run (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          function Fail($msg) { Write-Output "::error::$msg"; $script:failed = $true }
          $gdsh = Join-Path $env:BIN_DIR 'gdsh.cmd'
          # Through gdsh.cmd, as a user's `gdsh` resolves.
          function Expect($name, $want, $code, [string[]]$gdshArgs) {
            $out = (& $gdsh @gdshArgs 2>$null) -join "`n"
            if ($LASTEXITCODE -ne $code) { Fail "${name}: exit $LASTEXITCODE, expected $code" }
            if ($out -ne $want) { Fail "${name}: got [$out], expected [$want]" }
          }

          ./install.ps1 -From $env:ZIP -Dir $env:BIN_DIR
          & $gdsh --register $env:GODOT_BIN
          if ($LASTEXITCODE -ne 0) { Fail 'register failed' }
          $registry = Get-Content (Join-Path $env:GDSH_HOME 'executables')
          $registry
          if (-not ($registry -match '_console\.exe$')) { Fail 'the _console.exe sibling was not registered' }

          Set-Location $env:PROJ
          $cfg = Select-String -LiteralPath (Join-Path $env:GDSH_HOME 'cli/package.cfg') -Pattern '^version="(.*)"'
          Expect 'version' "gdsh-cli $($cfg.Matches[0].Groups[1].Value)" 0 @('--version')
          if (-not ((& $gdsh --help) -match 'gdsh syntax')) { Fail 'help lacks the syntax note' }
          Expect 'echo' 'hi' 0 @('echo hi')
          Expect 'pipe' 'hi' 0 @('echo hi | grep h')
          Expect 'false' '' 1 @('false')
          Expect 'block' 'file: project.godot' 0 @('for f in $(ls res://) { echo "file: $f" } | grep project')
          Expect 'script' 'from file' 0 @('-f', 't.gdsh')

          $foreign = Join-Path $env:RUNNER_TEMP 'foreign'
          New-Item -ItemType Directory -Path $foreign -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $foreign 'gdsh.cmd') -Value 'foreign'
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/install.ps1" -From $env:ZIP -Dir $foreign
          if ($LASTEXITCODE -eq 0) { Fail 'installed over a foreign wrapper' }
          & "$env:GITHUB_WORKSPACE/install.ps1" -Uninstall -Dir $env:BIN_DIR
          if ((Test-Path $gdsh) -or (Test-Path (Join-Path $env:GDSH_HOME 'cli'))) { Fail 'uninstall left files' }
          if (-not (Test-Path (Join-Path $env:GDSH_HOME 'executables'))) { Fail 'uninstall removed the registry' }
          if ($failed) { exit 1 }
