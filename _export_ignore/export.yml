export_root: "res://addons/_lib/gdsh_lib/cli/_export_ignore/exports"
plugin_folder: "Cli{{version=res://addons/_lib/gdsh_lib/cli}}"
pre_script: ""
post_script: ""
external: []
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: false
  ignore_tests: true
  use_tag_in_cfg: true
  include_min_version: true
  move_global_files: false
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: true
    parse_cs:
      namespace_rename: {}
    parse_gd:
      optimizer:
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
        debug_tags: false
        enabled: false
      class_rename_ignore: []
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/_lib/gdsh_lib/cli"
    # Unversioned, so releases/latest/download/gdsh-cli.zip always resolves.
    export_name: "gdsh-cli"
    export_folder: addons/_lib/gdsh_lib/cli
    # utils and settings are listed at runtime, so no reference gathers them.
    other_transfers:
      -
        from: "res://addons/_lib/gdsh_lib/utils/cmd"
        to: "vendor/addons/_lib/gdsh_lib/utils/cmd"
        recursive: true
      # Only settings from gdsh-lib-editor: the rest needs the editor (and tui).
      -
        from: "res://addons/_lib/gdsh_lib/editor/cmd/settings"
        to: "vendor/addons/_lib/gdsh_lib/editor/cmd/settings"
        recursive: true
